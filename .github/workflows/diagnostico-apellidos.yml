name: Diagnosticar fichero oficial de apellidos INE

on:
  workflow_dispatch:
  push:
    branches: [desarrollo]
    paths:
      - 'scripts/inspeccionar_apellidos.py'
      - '.github/workflows/diagnostico-apellidos.yml'

permissions:
  contents: read

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector de Excel XLS
        run: python -m pip install 'xlrd==2.0.2'
      - name: Descargar e inspeccionar fichero INE
        run: python scripts/inspeccionar_apellidos.py
      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estructura-apellidos-ine
          path: informes/estructura-apellidos.json
          if-no-files-found: ignore
          retention-days: 7
